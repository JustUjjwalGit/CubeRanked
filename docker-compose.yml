services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:4000/api/v1
      VITE_SOCKET_URL: http://127.0.0.1:4000/v1
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      APP_PORT: 4000
      APP_HOST: 0.0.0.0
      API_PREFIX: /api/v1
      FRONTEND_ORIGIN: http://127.0.0.1:5173
      LOG_LEVEL: info
    ports:
      - "4000:4000"
